name: Python CI

on:
  pull_request:
    branches:
      - develop

jobs:
  tests:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          python -m pytest \
            --cov=myapp \
            --cov-report=term-missing \
            --cov-report=html:coverage-report \
            --cov-fail-under=70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report/
          if-no-files-found: warn

  build:
    needs: tests
    if: ${{ needs.tests.result == 'success' }}

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build application
        run: python -m compileall myapp

      - name: Add build badge to README
        shell: bash
        run: |
          BADGE='![Python CI](https://github.com/${{ github.repository }}/actions/workflows/HelloActions.yml/badge.svg?event=pull_request)'

          touch README.md

          if grep -Fq "actions/workflows/HelloActions.yml/badge.svg" README.md; then
            echo "Badge already exists. README.md was not changed."
            exit 0
          fi

          printf '%s\n\n' "$BADGE" | cat - README.md > README.tmp
          mv README.tmp README.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "docs: add build status badge"
          git push origin HEAD:${{ github.head_ref }}